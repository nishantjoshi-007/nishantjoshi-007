<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nishant Joshi — Full-Stack and AI Engineer. Status: open to opportunities. Edison, NJ.">
  <title>Nishant Joshi — Full-Stack &amp; AI Engineer</title>

  <defs>
    <!-- acid-lime corner glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6F24E" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#C6F24E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>

    <!-- neural-field dot grid -->
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.2" fill="#EDEDE7" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="dotfade" cx="78%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask">
      <rect x="0" y="0" width="1200" height="440" fill="url(#dotfade)"/>
    </mask>

    <!-- CRT scanlines -->
    <pattern id="scan" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="1" fill="#000000" fill-opacity="0.5"/>
    </pattern>

    <!-- LED bloom -->
    <filter id="bloom" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono','SFMono-Regular',Menlo,Consolas,monospace; }
      .disp { font-family: 'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight: 800; }

      /* No base opacity:0 — if a renderer ignores CSS animation, content stays visible.
         animation-fill-mode:both supplies the hidden from-state only while animations run. */
      .reveal  { animation: fadein 0.55s cubic-bezier(.2,.8,.2,1) both; }
      .rise    { animation: risein 0.7s cubic-bezier(.2,.8,.2,1) both; }
      .line    { animation: linein 0.4s ease-out both; }

      .led     { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .cursor  { animation: blink 1.1s steps(1) infinite; }
      .glowEl  { animation: breathe 6s ease-in-out infinite; }
      .twk     { animation: twinkle 3.4s ease-in-out infinite; }

      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes risein { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes linein { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: 0.34; } }
      @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes breathe{ 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes twinkle{ 0%,100% { opacity: 0.12; } 50% { opacity: 0.55; } }

      @media (prefers-reduced-motion: reduce) {
        .reveal,.rise,.line { opacity: 1 !important; animation: none !important; transform: none !important; }
        .led,.cursor,.glowEl,.twk { animation: none !important; }
        .cursor { opacity: 1 !important; }
      }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="440" fill="#0A0A0B"/>
  <ellipse class="glowEl" cx="1050" cy="40" rx="420" ry="300" fill="url(#glow)"/>
  <rect x="560" y="0" width="640" height="440" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- twinkling field nodes -->
  <circle class="twk" cx="980"  cy="70"  r="2" fill="#C6F24E" style="animation-delay:.2s"/>
  <circle class="twk" cx="1098" cy="118" r="1.6" fill="#C6F24E" style="animation-delay:1.1s"/>
  <circle class="twk" cx="916"  cy="150" r="1.6" fill="#EDEDE7" style="animation-delay:1.9s"/>
  <circle class="twk" cx="1064" cy="58"  r="1.4" fill="#EDEDE7" style="animation-delay:.7s"/>

  <!-- hairline frame + corner ticks -->
  <rect x="18" y="18" width="1164" height="404" fill="none" stroke="#EDEDE7" stroke-opacity="0.08"/>
  <g stroke="#C6F24E" stroke-opacity="0.85" stroke-width="1.4">
    <path d="M18 34 V18 H34"/>
  </g>
  <g stroke="#EDEDE7" stroke-opacity="0.28" stroke-width="1.4">
    <path d="M1166 18 H1182 V34"/>
    <path d="M18 406 V422 H34"/>
    <path d="M1182 406 V422 H1166"/>
  </g>

  <!-- ================= TOP STATUS BAR ================= -->
  <g class="reveal" style="animation-delay:.05s">
    <g filter="url(#bloom)"><rect class="led" x="70" y="45" width="9" height="9" fill="#C6F24E"/></g>
    <text class="mono" x="92" y="53" font-size="12.5" letter-spacing="2.6" fill="#ACAAAD">OPEN TO OPPORTUNITIES</text>
    <text class="mono" x="1130" y="48" text-anchor="end" font-size="12.5" letter-spacing="2.2" fill="#ACAAAD">EDISON, NJ</text>
    <text class="mono" x="1130" y="65" text-anchor="end" font-size="10.5" letter-spacing="1.6" fill="#ACAAAD" fill-opacity="0.6">40.5187&#176; N / 74.4121&#176; W</text>
  </g>

  <!-- vertical divider between copy + terminal -->
  <line class="reveal" style="animation-delay:.9s" x1="652" y1="120" x2="652" y2="392" stroke="#EDEDE7" stroke-opacity="0.08"/>

  <!-- ================= LEFT — IDENTITY ================= -->
  <text class="mono reveal" style="animation-delay:.15s" x="70" y="146" font-size="14" letter-spacing="3.4" fill="#C6F24E">// FULL-STACK &amp; AI ENGINEER</text>

  <text class="disp rise" style="animation-delay:.28s" x="64" y="246" font-size="108" letter-spacing="-4" fill="#EDEDE7">NISHANT</text>
  <text class="disp rise" style="animation-delay:.42s" x="66" y="338" font-size="108" letter-spacing="-4" fill="none" stroke="#EDEDE7" stroke-opacity="0.42" stroke-width="1.4">JOSHI</text>

  <text class="reveal" style="animation-delay:1.15s; font-family:'Space Grotesk',system-ui,Arial,sans-serif;" x="70" y="392" font-size="15.5" fill="#ACAAAD">I turn complex ideas into things people actually use.</text>

  <!-- ================= RIGHT — TERMINAL READOUT ================= -->
  <g class="reveal" style="animation-delay:.55s">
    <rect x="688" y="138" width="448" height="258" fill="#101012" stroke="#EDEDE7" stroke-opacity="0.10"/>
    <line x1="688" y1="172" x2="1136" y2="172" stroke="#EDEDE7" stroke-opacity="0.08"/>
    <circle cx="706" cy="155" r="3" fill="#C6F24E"/>
    <text class="mono" x="720" y="159" font-size="11.5" letter-spacing="1.8" fill="#ACAAAD">profile_os</text>
    <text class="mono" x="1120" y="159" text-anchor="end" font-size="11.5" letter-spacing="1.8" fill="#ACAAAD" fill-opacity="0.55">v1.0.0</text>
  </g>

  <g class="mono" font-size="14.5">
    <text class="line" style="animation-delay:.7s"  x="708" y="206" fill="#6f6f72">&gt; mounting modules ........... <tspan fill="#C6F24E">ok</tspan></text>
    <text class="line" style="animation-delay:.86s" x="708" y="234" fill="#6f6f72">&gt; loading neural_field ....... <tspan fill="#C6F24E">ok</tspan></text>
    <text class="line" style="animation-delay:1.02s" x="708" y="262" fill="#ACAAAD">&gt; operator: <tspan fill="#EDEDE7">NISHANT JOSHI</tspan></text>
    <text class="line" style="animation-delay:1.18s" x="708" y="290" fill="#ACAAAD">&gt; role: <tspan fill="#EDEDE7">FULL-STACK &amp; AI ENGINEER</tspan></text>
    <text class="line" style="animation-delay:1.34s" x="708" y="318" fill="#ACAAAD">&gt; based: <tspan fill="#EDEDE7">EDISON, NJ</tspan></text>
    <text class="line" style="animation-delay:1.5s"  x="708" y="346" fill="#ACAAAD">&gt; status: <tspan fill="#C6F24E">READY</tspan></text>
    <rect class="cursor" x="812" y="334" width="10" height="16" fill="#C6F24E" style="animation-delay:1.7s"/>
    <text class="line" style="animation-delay:1.62s" x="708" y="374" fill="#6f6f72">&gt; _ shipping since 2022</text>
  </g>

  <!-- scanline overlay (above everything, very subtle) -->
  <rect x="0" y="0" width="1200" height="440" fill="url(#scan)" fill-opacity="0.10" pointer-events="none"/>
</svg>
